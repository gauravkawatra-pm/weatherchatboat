<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PIN Code Weather Chat</title>
<style>
  :root {
    --bg: #f2f5f3;
    --panel: #ffffff;
    --ink: #17211d;
    --muted: #5d6b65;
    --line: #d9e1dc;
    --accent: #0f766e;
    --accent-ink: #ffffff;
    --bot: #e7efeb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101614;
      --panel: #18211e;
      --ink: #e8efec;
      --muted: #9aaba3;
      --line: #2a3732;
      --accent: #2fb5a8;
      --accent-ink: #06201d;
      --bot: #22302b;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 640px;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
  }
  header { padding: 16px 20px 12px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-size: 1.15rem; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: .9rem; }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg { max-width: 85%; padding: 9px 13px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bot { background: var(--bot); align-self: flex-start; }
  .me { background: var(--accent); color: var(--accent-ink); align-self: flex-end; }
  .err { background: transparent; border: 1px solid #b3261e; color: #b3261e; align-self: flex-start; }
  @media (prefers-color-scheme: dark) { .err { color: #ff8a80; border-color: #ff8a80; } }
  .tokens {
    padding: 8px 20px;
    border-top: 1px solid var(--line);
    font-size: .85rem;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .tokens button {
    background: none; border: 0; padding: 0; color: var(--muted);
    text-decoration: underline; cursor: pointer; font: inherit;
  }
  form { display: flex; gap: 8px; padding: 12px 20px 16px; border-top: 1px solid var(--line); }
  input[type="text"] {
    flex: 1; min-width: 0; padding: 10px 12px; font: inherit;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--bg); color: var(--ink);
  }
  button.send {
    padding: 10px 18px; font: inherit; font-weight: 600; border: 0; border-radius: 10px;
    background: var(--accent); color: var(--accent-ink); cursor: pointer;
  }
  button.send:disabled { opacity: .55; cursor: wait; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>PIN Code Weather Chat</h1>
    <p>Type a 6-digit Indian PIN code to get the current temperature.</p>
  </header>

  <div id="log" role="log" aria-live="polite">
    <div class="msg bot">Hi! Send me a PIN code, for example 110001.</div>
  </div>

  <div class="tokens">
    <span id="last">Last reply: 0 tokens</span>
    <span>
      <span id="total">Total used here: 0 tokens</span>
      · <button type="button" id="reset">reset</button>
    </span>
  </div>

  <form id="form">
    <label for="msg" hidden>Your message</label>
    <input type="text" id="msg" autocomplete="off" maxlength="300" placeholder="e.g. 560001" required>
    <button class="send" id="send" type="submit">Send</button>
  </form>
</main>

<script>
  // STEP: replace this with your own Worker address after you deploy it on Cloudflare.
  const WORKER_URL = "https://sweet-term-a0a2.gaurav-kawatra-mba.workers.dev";

  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("msg");
  const sendBtn = document.getElementById("send");
  const lastEl = document.getElementById("last");
  const totalEl = document.getElementById("total");

  // Running total is kept in this browser only. Google's own dashboard shows the real account-wide usage.
  let total = 0;
  try { total = Number(localStorage.getItem("tokenTotal")) || 0; } catch (e) {}
  showTotal();

  function showTotal() {
    totalEl.textContent = "Total used here: " + total.toLocaleString("en-IN") + " tokens";
  }

  function add(text, cls) {
    const div = document.createElement("div");
    div.className = "msg " + cls;
    div.textContent = text; // textContent keeps any text safe from HTML injection
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    add(text, "me");
    input.value = "";
    sendBtn.disabled = true;
    const waiting = add("Checking…", "bot");

    try {
      const res = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text }),
      });
      const data = await res.json();
      waiting.remove();
      if (!res.ok) throw new Error(data.error || "Something went wrong.");

      add(data.reply, "bot");
      const used = data.usage?.total || 0;
      total += used;
      try { localStorage.setItem("tokenTotal", String(total)); } catch (e) {}
      lastEl.textContent = "Last reply: " + used + " tokens (" +
        (data.usage?.prompt || 0) + " in, " + (data.usage?.output || 0) + " out)";
      showTotal();
    } catch (err) {
      waiting.remove();
      add(err.message, "err");
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  });

  document.getElementById("reset").addEventListener("click", () => {
    total = 0;
    try { localStorage.removeItem("tokenTotal"); } catch (e) {}
    lastEl.textContent = "Last reply: 0 tokens";
    showTotal();
  });
</script>
</body>
</html>
